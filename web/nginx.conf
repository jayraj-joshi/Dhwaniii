server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # hashed build files never change
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # the service worker and the files that name the current build must always be re-checked, or installed apps never update
  location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ { add_header Cache-Control "no-cache"; try_files $uri =404; }

  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }

  # single-page app: every other path is a client-side route
  location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
